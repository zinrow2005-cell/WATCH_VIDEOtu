<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KTV 攝影機獨立診斷</title><style>body{background:#101b2b;color:#ecf3ff;font:17px system-ui,sans-serif;max-width:850px;margin:auto;padding:20px}button,select{font:inherit;padding:12px;border-radius:10px;margin:5px;color:#fff;background:#29476c;border:1px solid #789}video{width:100%;max-height:65vh;background:black;object-fit:contain;border-radius:12px}p{line-height:1.5}#stats{white-space:pre-wrap;padding:15px;background:#223951;border-radius:12px}button:disabled{opacity:.5}</style></head><body><h2>📷 KTV 純攝影機效能測試</h2><p>這裡沒有 YouTube、AI 去背、畫布合成或錄影。請比較不同解析度下，人物動作是否仍會卡住。</p><label>攝影機設定 <select id="profile"><option value="640,480,30">640×480 / 30fps</option><option value="640,480,15">640×480 / 15fps</option><option value="320,240,30">320×240 / 30fps</option><option value="1280,720,30">1280×720 / 30fps</option></select></label><button id="start">開啟鏡頭</button><button id="stop" disabled>關閉鏡頭</button><video id="preview" autoplay muted playsinline></video><div id="stats">尚未啟動</div><p>等待約 10 秒，看「實際收到 fps」與是否卡頓。請不要同時開啟 Windows 相機或其他佔用攝影機的程式。</p><script>const v=document.querySelector('#preview'),stats=document.querySelector('#stats'),start=document.querySelector('#start'),stop=document.querySelector('#stop'),profile=document.querySelector('#profile');let stream=null,frameId=null,timer=null,frames=0,previous=0,last=0,measured='等待影格';function teardown(){if(frameId!==null&&v.cancelVideoFrameCallback)try{v.cancelVideoFrameCallback(frameId)}catch{};frameId=null;if(timer)clearInterval(timer);timer=null;v.pause();v.srcObject=null;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;start.disabled=false;stop.disabled=true}stop.onclick=()=>{teardown();stats.textContent='鏡頭已關閉'};start.onclick=async()=>{teardown();const [width,height,fps]=profile.value.split(',').map(Number);try{stream=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:width},height:{ideal:height},frameRate:{ideal:fps}},audio:false});v.srcObject=stream;await v.play();start.disabled=true;stop.disabled=false;frames=0;previous=0;last=performance.now();const tick=()=>{frames++;frameId=v.requestVideoFrameCallback(tick)};if(v.requestVideoFrameCallback)frameId=v.requestVideoFrameCallback(tick);timer=setInterval(()=>{const now=performance.now(),elapsed=(now-last)/1000;measured=v.requestVideoFrameCallback?((frames-previous)/elapsed).toFixed(1)+' fps':'瀏覽器不支援影格回呼';previous=frames;last=now;const track=stream?.getVideoTracks()[0],s=track?.getSettings?.()||{};stats.textContent='實際收到：'+measured+'\n攝影機回報：'+(s.width||'?')+'×'+(s.height||'?')+'／'+(s.frameRate||'?')+' fps\n影片影像：'+v.videoWidth+'×'+v.videoHeight+'\n軌道狀態：'+(track?.readyState||'?')+'\n是否播放：'+(!v.paused);},2000)}catch(e){teardown();stats.textContent='無法啟動：'+e.name+' '+e.message+'（請使用 HTTPS 的 GitHub Pages）'}};window.addEventListener('pagehide',teardown)</script></body></html>
