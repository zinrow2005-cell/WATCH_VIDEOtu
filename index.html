<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#081525">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>FamilyTube 家庭影音</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button id="homeBtn" class="brand brand-button" type="button" aria-label="回首頁">
        <div class="brand-mark">▶</div>
        <div><h1>FamilyTube</h1><p>孩子的家庭影音空間</p></div>
      </button>
      <div class="top-actions">
        <button id="timerBadge" class="timer-badge hidden" type="button">⏱ --:--</button>
        <button id="focusBtn" class="ghost-btn" type="button">進入兒童模式</button>
        <button id="parentBtn" class="ghost-btn" type="button">家長設定</button>
      </div>
    </header>

    <main>
      <section id="homeView" class="home-view">
        <div class="hero-card">
          <div>
            <span class="eyebrow">今天想看什麼？</span>
            <h2>選一個分類開始看</h2>
            <p>大圖示、少按鈕，專為 iPad 與小朋友操作設計。</p>
          </div>
          <button id="continueBtn" class="continue-btn hidden" type="button"><span>繼續觀看</span><strong id="continueTitle">上次影片</strong></button>
        </div>
        <div id="homeCategories" class="home-categories"></div>
        <section class="shelf-section">
          <div class="section-head"><div><span class="eyebrow">最近觀看</span><h2>接著看</h2></div></div>
          <div id="recentShelf" class="poster-grid"></div>
        </section>
        <section class="shelf-section">
          <div class="section-head"><div><span class="eyebrow">我的最愛</span><h2>最喜歡的影片</h2></div></div>
          <div id="favoriteShelf" class="poster-grid"></div>
        </section>
      </section>

      <section id="watchView" class="watch-view hidden">
        <div class="watch-layout">
          <section class="player-panel">
            <div class="video-frame" id="videoFrame">
              <div id="player"></div>
              <div id="playerError" class="player-error hidden"><div class="player-error-card"><strong id="playerErrorTitle">影片無法播放</strong><p id="playerErrorText"></p></div></div>
              <div id="emptyPlayer" class="empty-player"><div><div class="empty-icon">▶</div><h2>先選一部影片</h2><p>從右側影片庫選擇影片。</p></div></div>
            </div>
            <div class="now-playing">
              <div class="now-title-row">
                <div class="now-copy"><span class="eyebrow">現在播放</span><h2 id="nowTitle">尚未選擇影片</h2><p id="nowMeta">—</p></div>
                <button id="favoriteBtn" class="favorite-big" type="button" aria-label="加入最愛">☆</button>
              </div>
              <div class="control-row">
                <button id="prevBtn" class="control-btn" type="button">◀ 上一部</button>
                <button id="playPauseBtn" class="control-btn primary" type="button">播放 / 暫停</button>
                <button id="nextBtn" class="control-btn" type="button">下一部 ▶</button>
                <button id="fullscreenBtn" class="control-btn" type="button">全螢幕</button>
              </div>
            </div>
          </section>

          <aside class="library-panel">
            <div class="library-head">
              <div><span class="eyebrow">家庭影片庫</span><h2 id="libraryTitle">選擇影片</h2></div>
              <button id="addBtn" class="round-btn parent-only" type="button" aria-label="新增影片">＋</button>
            </div>
            <div id="categoryBar" class="category-bar"></div>
            <div id="videoList" class="video-list"></div>
          </aside>
        </div>
      </section>
    </main>
  </div>

  <div id="pinModal" class="modal hidden" aria-hidden="true">
    <div class="modal-card pin-card">
      <div class="modal-head"><div><span class="eyebrow">家長驗證</span><h2 id="pinTitle">輸入家長 PIN</h2></div><button class="icon-btn" id="closePin" type="button">✕</button></div>
      <input id="pinInput" class="pin-input" type="password" inputmode="numeric" maxlength="6" placeholder="輸入 PIN">
      <button id="pinConfirmBtn" class="save-btn" type="button">確認</button>
      <p id="pinMsg" class="form-msg"></p>
    </div>
  </div>

  <div id="parentModal" class="modal hidden" aria-hidden="true">
    <div class="modal-card">
      <div class="modal-head"><div><span class="eyebrow">家長專區</span><h2>新增 YouTube 影片</h2></div><button class="icon-btn" id="closeModal" type="button">✕</button></div>
      <label>YouTube 網址<input id="urlInput" type="url" inputmode="url" placeholder="https://www.youtube.com/watch?v=..."></label>
      <label>顯示名稱<input id="titleInput" type="text" placeholder="例如：英文兒歌 01"></label>
      <label>分類<input id="categoryInput" type="text" placeholder="例如：英文、兒歌、故事"></label>
      <button id="saveVideoBtn" class="save-btn" type="button">加入影片庫</button>
      <p id="formMsg" class="form-msg"></p>
    </div>
  </div>

  <div id="settingsModal" class="modal hidden" aria-hidden="true">
    <div class="modal-card settings-card">
      <div class="modal-head"><div><span class="eyebrow">家長設定</span><h2>播放、安全與時間</h2></div><button class="icon-btn" id="closeSettings" type="button">✕</button></div>
      <label class="switch-row"><span>播完自動下一部</span><input id="autoplayToggle" type="checkbox" checked></label>
      <label class="switch-row"><span>兒童模式隱藏管理功能</span><input id="kidLockToggle" type="checkbox" checked></label>
      <div class="setting-block"><strong>觀看時間</strong><p>倒數結束後會自動暫停影片。</p><div class="timer-options"><button data-minutes="0" type="button">不限時</button><button data-minutes="15" type="button">15 分</button><button data-minutes="30" type="button">30 分</button><button data-minutes="45" type="button">45 分</button><button data-minutes="60" type="button">60 分</button></div></div>
      <div class="setting-block"><strong>家長 PIN</strong><p id="pinStatus">尚未設定</p><div class="inline-form"><input id="newPinInput" type="password" inputmode="numeric" maxlength="6" placeholder="4～6 位數"><button id="savePinBtn" type="button">設定 PIN</button></div></div>
      <button id="exportBtn" class="secondary-action" type="button">匯出影片清單</button>
      <button id="importBtn" class="secondary-action" type="button">匯入影片清單</button>
      <input id="importFile" type="file" accept="application/json" class="hidden">
      <button id="resetBtn" class="danger-action" type="button">清除本機資料</button>
      <p class="small-note">資料只儲存在這台裝置的瀏覽器。PIN 是家庭操作鎖，不是高強度安全機制。</p>
    </div>
  </div>

  <div id="timeUpModal" class="modal hidden" aria-hidden="true"><div class="modal-card timeup-card"><div class="timeup-icon">⏰</div><h2>今天先休息一下</h2><p>設定的觀看時間到了，影片已經暫停。</p><button id="timeUpOk" class="save-btn" type="button">知道了</button></div></div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="app.js"></script>
</body>
</html>
