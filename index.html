<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>FamilyTube V1.2</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">FamilyTube <span>V1.2</span></div>
  <div class="top-actions">
    <button id="profileBtn" class="pill">👧 女兒</button>
    <button id="kidModeBtn" class="pill">🧒 兒童模式</button>
    <button id="parentBtn" class="pill">🔒 家長</button>
  </div>
</header>

<main>
  <section id="playerSection" class="player-wrap">
    <div id="player"></div>
    <div class="controls">
      <button id="prevBtn">⏮</button>
      <button id="playBtn">▶ / ⏸</button>
      <button id="nextBtn">⏭</button>
      <button id="favBtn">☆ 最愛</button>
      <button id="fullBtn">⛶ 全螢幕</button>
    </div>
    <div id="nowPlaying" class="now-playing">尚未選擇影片</div>
  </section>

  <section class="home-grid">
    <button class="home-card" data-filter="all">🎬<b>全部影片</b></button>
    <button class="home-card" data-filter="favorite">⭐<b>我的最愛</b></button>
    <button class="home-card" data-filter="recent">🕘<b>最近觀看</b></button>
    <button class="home-card" data-filter="英文">🔤<b>英文</b></button>
    <button class="home-card" data-filter="兒歌">🎵<b>兒歌</b></button>
    <button class="home-card" data-filter="卡通">🐻<b>卡通</b></button>
    <button class="home-card" data-filter="故事">📚<b>故事</b></button>
    <button class="home-card" data-filter="學習">🧠<b>學習</b></button>
  </section>

  <section>
    <div class="section-head">
      <h2 id="libraryTitle">全部影片</h2>
      <div class="section-actions">
        <button id="playlistPlayBtn" class="secondary">▶ 播放目前清單</button>
      </div>
    </div>
    <div id="videoGrid" class="video-grid"></div>
  </section>

  <section id="parentPanel" class="parent-panel hidden">
    <h2>家長管理</h2>
    <div class="admin-grid">
      <div class="admin-card">
        <h3>新增影片</h3>
        <input id="urlInput" placeholder="貼上 YouTube 網址">
        <input id="titleInput" placeholder="影片名稱（可不填）">
        <select id="categoryInput">
          <option>英文</option><option>兒歌</option><option>卡通</option>
          <option>故事</option><option>學習</option><option>其他</option>
        </select>
        <button id="addBtn">＋ 加入影片</button>
      </div>

      <div class="admin-card">
        <h3>觀看時間</h3>
        <select id="timeLimit">
          <option value="0">不限時</option>
          <option value="15">15 分鐘</option>
          <option value="30">30 分鐘</option>
          <option value="45">45 分鐘</option>
          <option value="60">60 分鐘</option>
        </select>
        <div id="timerText">不限時</div>
      </div>

      <div class="admin-card">
        <h3>PIN 設定</h3>
        <input id="pinInput" inputmode="numeric" maxlength="6" placeholder="4～6 位數 PIN">
        <button id="savePinBtn">儲存 PIN</button>
      </div>

      <div class="admin-card">
        <h3>資料備份</h3>
        <button id="exportBtn">匯出備份</button>
        <label class="file-btn">匯入備份<input id="importInput" type="file" accept="application/json"></label>
      </div>
    </div>

    <h3>影片庫排序與編輯</h3>
    <div class="hint">可用滑鼠拖曳；iPad 可使用「上移 / 下移」按鈕。</div>
    <div id="manageList" class="manage-list"></div>
  </section>
</main>

<div id="modal" class="modal hidden">
  <div class="modal-card">
    <h3 id="modalTitle">輸入 PIN</h3>
    <input id="modalInput" inputmode="numeric" maxlength="6">
    <div class="modal-actions">
      <button id="modalCancel">取消</button>
      <button id="modalOk">確定</button>
    </div>
  </div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script src="app.js"></script>
</body>
</html>
