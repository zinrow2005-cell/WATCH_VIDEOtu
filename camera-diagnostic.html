<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>純鏡頭效能診斷 V1.5.7.28</title><style>body{margin:0;background:#111c2d;color:#fff;font:16px system-ui,sans-serif;padding:20px;max-width:860px;margin:auto}button,select{font:inherit;border:0;border-radius:10px;padding:12px;margin:4px;background:#385477;color:white}video{display:block;width:100%;max-height:65vh;object-fit:contain;background:#000;border-radius:12px}p{color:#bed0e2}.stat{padding:14px;background:#1f3552;border-radius:12px;margin:12px 0}.warn{color:#ffcd8c}</style></head><body><h1>🧪 純鏡頭效能診斷</h1><p>這個頁面不會播放 YouTube、不啟動去背或錄影，也不會上傳影像。請先關閉原本 KTV 鏡頭再測試。</p><label>解析度 <select id="size"><option value="640">640×480</option><option value="320">320×240</option><option value="1280">1280×720</option></select></label><button id="start">▶ 開啟鏡頭</button><button id="stop">■ 關閉鏡頭</button><video id="v" autoplay muted playsinline></video><div class="stat" id="status">尚未測試</div><p class="warn">若這裡也卡，優先檢查 Chrome 網站攝影機設定、Windows 相機程式、USB 接孔與攝影機驅動。若這裡順暢但 KTV 卡，再檢查 KTV 播放器疊層或其他背景工作。</p><script>let stream=null,raf=0,frames=0,last=0,lastMedia=0;const v=document.getElementById('v'),s=document.getElementById('status');function stop(){if(stream)stream.getTracks().forEach(x=>x.stop());stream=null;v.pause();v.srcObject=null;if(raf)cancelAnimationFrame(raf);raf=0;s.textContent='鏡頭已關閉'}document.getElementById('stop').onclick=stop;document.getElementById('start').onclick=async()=>{stop();try{let w=+document.getElementById('size').value,h=w===1280?720:w===640?480:240;stream=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:w},height:{ideal:h},frameRate:{ideal:30}},audio:false});v.srcObject=stream;await v.play();const t=stream.getVideoTracks()[0],cfg=t.getSettings();frames=0;last=performance.now();lastMedia=0;function tick(now){if(!stream)return;const media=v.getVideoPlaybackQuality?.().totalVideoFrames;if(typeof media==='number')frames=media;else if(v.currentTime!==lastMedia){frames++;lastMedia=v.currentTime;}if(now-last>=2000){const rendered=typeof media==='number'? Math.max(0,media-(tick.prev||0)):frames;(tick.prev)=media||0;s.textContent=`實際設定 ${cfg.width}×${cfg.height}，裝置宣告 ${cfg.frameRate||'未知'} fps｜約 ${Math.round(rendered*1000/(now-last))} 個顯示影格/秒（估算）｜${t.readyState}`;last=now;if(typeof media!=='number')frames=0;}raf=requestAnimationFrame(tick)}raf=requestAnimationFrame(tick)}catch(e){s.textContent='開啟失敗：'+e.message}};window.addEventListener('pagehide',stop);</script></body></html>
